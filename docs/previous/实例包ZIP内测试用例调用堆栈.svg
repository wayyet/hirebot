<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 820" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="920" height="820" fill="url(#bg)"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">实例包 ZIP 内测试用例写入调用堆栈</text>
  <text x="460" y="58" text-anchor="middle" font-size="12" fill="#64748b">生成（雇佣对话）→ 运行时包 → 合并进最终 ZIP（import-package）</text>

  <g font-size="11" fill="#475569" font-weight="600">
    <text x="24" y="92">L0</text>
    <text x="24" y="162">L1</text>
    <text x="24" y="242">L2</text>
    <text x="24" y="322">L3</text>
    <text x="24" y="412">L4</text>
    <text x="24" y="502">L5</text>
    <text x="24" y="592">L6</text>
    <text x="24" y="682">L7</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="72" width="680" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="460" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">雇佣前 3 阶段：skill 材料 + StructuredData 入库</text>
    <text x="460" y="116" text-anchor="middle" font-size="10" fill="#b45309">Materials(Type=skill) · business_goal / user_profile 等</text>
  </g>

  <line x1="460" y1="128" x2="460" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="140" width="680" height="56" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="460" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">ProcessConversationTurnAsync</text>
    <text x="460" y="184" text-anchor="middle" font-size="10" fill="#4338ca">每轮对话结束 · EmployeeHiringService.ConversationOrchestration</text>
  </g>

  <line x1="460" y1="196" x2="460" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="208" width="680" height="56" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="460" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#9d174d">ApplyConversationProgressToTemplatePackage</text>
    <text x="460" y="252" text-anchor="middle" font-size="10" fill="#be185d">更新 WorkingTemplatePackage（内存模板包）</text>
  </g>

  <line x1="460" y1="264" x2="460" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="276" width="680" height="72" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="460" y="302" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">TryBuildEvaluationTestCases</text>
    <text x="460" y="322" text-anchor="middle" font-size="10" fill="#b91c1c">生成 eval-case-001~003 · source=conversation-skill-guided</text>
    <text x="460" y="340" text-anchor="middle" font-size="10" fill="#b91c1c">UpsertPackageFile → testcases/evaluation-test-cases.json</text>
  </g>

  <line x1="460" y1="348" x2="460" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="360" width="320" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="280" y="386" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">时机① 中间 ZIP（可选）</text>
    <text x="280" y="406" text-anchor="middle" font-size="10" fill="#1d4ed8">PersistIntermediatePackageAsync</text>
    <text x="280" y="422" text-anchor="middle" font-size="9" fill="#2563eb">packages/intermediate/package.zip</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="480" y="360" width="320" height="72" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="640" y="386" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">时机② 沙箱 ZIP（通常无 testcases）</text>
    <text x="640" y="406" text-anchor="middle" font-size="10" fill="#047857">package_workspace → template_package</text>
    <text x="640" y="422" text-anchor="middle" font-size="9" fill="#059669">白名单：manifest/ontology/skills/external/config</text>
  </g>

  <path d="M280 432 L280 448 L640 448 L640 432" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="460" y1="448" x2="460" y2="468" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="468" width="680" height="56" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="460" y="494" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">HiringPage.triggerCreate → importPackage</text>
    <text x="460" y="512" text-anchor="middle" font-size="10" fill="#4338ca">POST /hirings/{hireId}/import-package</text>
  </g>

  <line x1="460" y1="524" x2="460" y2="536" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="536" width="680" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="460" y="562" text-anchor="middle" font-size="13" font-weight="600" fill="#6b21a8">ImportPackageAsync · MergeTemplatePackageArtifacts</text>
    <text x="460" y="582" text-anchor="middle" font-size="10" fill="#7e22ce">沙箱 ZIP（高） + Store Skill（中） + WorkingTemplatePackage（低 TryAdd）</text>
    <text x="460" y="600" text-anchor="middle" font-size="10" fill="#7e22ce">testcases/ 由第三层补入最终合并结果</text>
  </g>

  <line x1="460" y1="608" x2="460" y2="620" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="620" width="680" height="56" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="460" y="646" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">PersistFinalPackageAsync</text>
    <text x="460" y="664" text-anchor="middle" font-size="10" fill="#b91c1c">packages/final/package.zip · 实例制品含 test case</text>
  </g>

  <g transform="translate(120, 696)">
    <rect width="680" height="100" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="16" y="22" font-size="11" font-weight="600" fill="#334155">图例</text>
    <rect x="16" y="32" width="14" height="14" fill="#fee2e2" stroke="#ef4444"/>
    <text x="38" y="43" font-size="10" fill="#475569">测试用例生成/写入</text>
    <rect x="200" y="32" width="14" height="14" fill="#ecfdf5" stroke="#10b981"/>
    <text x="222" y="43" font-size="10" fill="#475569">沙箱打包（通常无 testcases）</text>
    <rect x="400" y="32" width="14" height="14" fill="#f3e8ff" stroke="#a855f7"/>
    <text x="422" y="43" font-size="10" fill="#475569">import 合并落盘</text>
    <text x="16" y="62" font-size="9" fill="#64748b">模块：雇佣 Hiring（EmployeeHiringService）· 消费：AI 评估 evaluation-expert</text>
    <text x="16" y="78" font-size="9" fill="#64748b">关键文件：testcases/evaluation-test-cases.json（及 ontology/hiring-session/ 副本）</text>
    <text x="16" y="94" font-size="9" fill="#64748b">详见：docs/实例包ZIP内测试用例功能模块分析.md</text>
  </g>
</svg>