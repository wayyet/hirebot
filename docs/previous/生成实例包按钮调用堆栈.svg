<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="920" height="780" fill="url(#bg)"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">「生成实例包」按钮调用堆栈</text>
  <text x="460" y="58" text-anchor="middle" font-size="12" fill="#64748b">自上而下：用户操作 → 前端 UI / 页面编排 → API → AI 沙箱 / 领域服务</text>

  <g font-size="11" fill="#475569" font-weight="600">
    <text x="24" y="92">L0</text>
    <text x="24" y="152">L1</text>
    <text x="24" y="232">L2</text>
    <text x="24" y="332">L3</text>
    <text x="24" y="452">L4</text>
    <text x="24" y="552">L5</text>
    <text x="24" y="652">L6</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="72" width="680" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="460" y="99" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">用户点击「生成实例包」</text>
  </g>

  <line x1="460" y1="116" x2="460" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="128" width="680" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="460" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">HiringTodoPanel.FinalCard</text>
    <text x="460" y="172" text-anchor="middle" font-size="11" fill="#1d4ed8">onClick → onGenerate · canGenerate={allDone} · i18n: hiring.todo.final.generateBtn</text>
  </g>

  <line x1="460" y1="184" x2="460" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="196" width="680" height="108" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="460" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">HiringPage（页面编排）</text>
    <text x="460" y="244" text-anchor="middle" font-size="11" fill="#4338ca">onGenerate={() =&gt; handleRequestPackaging()}</text>
    <rect x="150" y="256" width="300" height="36" rx="6" fill="#fff" stroke="#818cf8"/>
    <text x="300" y="278" text-anchor="middle" font-size="10" fill="#4338ca">handleRequestPackaging()</text>
    <rect x="470" y="256" width="300" height="36" rx="6" fill="#fff" stroke="#818cf8"/>
    <text x="620" y="278" text-anchor="middle" font-size="10" fill="#4338ca">HiringProgressLedger.onFinalize（双入口）</text>
  </g>

  <line x1="300" y1="304" x2="300" y2="318" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="292" x2="620" y2="318" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="620" y1="318" x2="300" y2="318" stroke="#94a3b8" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="120" y="318" width="680" height="108" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="460" y="344" text-anchor="middle" font-size="13" font-weight="600" fill="#6b21a8">分支判断</text>
    <rect x="140" y="356" width="280" height="56" rx="6" fill="#faf5ff" stroke="#c084fc"/>
    <text x="280" y="378" text-anchor="middle" font-size="10" font-weight="600" fill="#7e22ce">已有 pendingPackageArtifact</text>
    <text x="280" y="396" text-anchor="middle" font-size="10" fill="#7e22ce">→ triggerCreate()</text>
    <rect x="500" y="356" width="280" height="56" rx="6" fill="#faf5ff" stroke="#c084fc"/>
    <text x="640" y="378" text-anchor="middle" font-size="10" font-weight="600" fill="#7e22ce">尚无产物包</text>
    <text x="640" y="396" text-anchor="middle" font-size="10" fill="#7e22ce">→ submitWorkflowMessage(打包话术)</text>
  </g>

  <line x1="640" y1="412" x2="640" y2="428" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="426" x2="300" y2="440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="428" width="320" height="88" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="280" y="454" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">employment-coach（沙箱 / WS）</text>
    <text x="280" y="474" text-anchor="middle" font-size="10" fill="#047857">stage4_packaging · package_workspace</text>
    <text x="280" y="492" text-anchor="middle" font-size="10" fill="#047857">→ template_package artifact</text>
    <text x="280" y="508" text-anchor="middle" font-size="9" fill="#059669">WebSocket 更新 pendingPackageArtifact</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="480" y="428" width="320" height="88" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="640" y="454" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">HiringPage.triggerCreate()</text>
    <text x="640" y="474" text-anchor="middle" font-size="10" fill="#4338ca">网关下载 zip 文件</text>
    <text x="640" y="492" text-anchor="middle" font-size="10" fill="#4338ca">api.hiringWorkflow.importPackage()</text>
    <text x="640" y="508" text-anchor="middle" font-size="9" fill="#6366f1">useEffect 可自动触发</text>
  </g>

  <path d="M280 516 L280 528 L640 528 L640 516" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="640" y1="516" x2="640" y2="536" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="536" width="680" height="56" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="460" y="562" text-anchor="middle" font-size="13" font-weight="600" fill="#9d174d">HiringsController.ImportPackage</text>
    <text x="460" y="582" text-anchor="middle" font-size="11" fill="#be185d">POST /hirings/{hireId}/import-package · multipart zip + skillIds</text>
  </g>

  <line x1="460" y1="592" x2="460" y2="604" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="604" width="680" height="72" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="460" y="632" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">EmployeeHiringService.ImportPackageAsync</text>
    <text x="460" y="652" text-anchor="middle" font-size="10" fill="#b91c1c">解析 ZIP · 合并 store skill · 创建数字员工实例</text>
    <text x="460" y="668" text-anchor="middle" font-size="10" fill="#b91c1c">collectionPhase → FINALIZED · instanceCreated=true</text>
  </g>

  <g transform="translate(120, 696)">
    <rect width="680" height="64" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="16" y="22" font-size="11" font-weight="600" fill="#334155">图例</text>
    <rect x="16" y="32" width="14" height="14" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="38" y="43" font-size="10" fill="#475569">前端 UI / 页面</text>
    <rect x="160" y="32" width="14" height="14" fill="#ecfdf5" stroke="#10b981"/>
    <text x="182" y="43" font-size="10" fill="#475569">AI 沙箱</text>
    <rect x="260" y="32" width="14" height="14" fill="#fce7f3" stroke="#ec4899"/>
    <text x="282" y="43" font-size="10" fill="#475569">API 控制器</text>
    <rect x="380" y="32" width="14" height="14" fill="#fee2e2" stroke="#ef4444"/>
    <text x="402" y="43" font-size="10" fill="#475569">领域服务</text>
    <text x="16" y="58" font-size="9" fill="#64748b">双入口：HiringProgressLedger.onFinalize 与 FinalCard.onGenerate 均汇聚 handleRequestPackaging</text>
  </g>
</svg>
