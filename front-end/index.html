<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good Crew</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- 当后端可用时，从后端读取运行时配置（OIDC / API 地址）。
         后端不可用时 onerror 回退，前端自行使用环境变量。
         此标签为同步非模块脚本，在所有 ESM 模块执行前完成。 -->
    <script src="/runtime-config.js" onerror="window.__AUTH_CONFIG__={}"></script>
    <script>
      (function () {
        var warmThemeEnabled = window.__AUTH_CONFIG__ && window.__AUTH_CONFIG__.EnableWarmTheme === true;
        var storedLanguage = localStorage.getItem('ncrew-hire-lang');
        var language = (storedLanguage || document.documentElement.lang || navigator.language || 'zh').toLowerCase();
        if (!warmThemeEnabled) {
          document.title = language.indexOf('zh') === 0 ? '好雇' : 'Good Crew';
          return;
        }

        var favicon = document.getElementById('app-favicon');
        if (favicon) {
          favicon.setAttribute('href', '/favicon-warm.svg');
        }

        document.title = 'Y Work';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
