replicaCount: 1

image:
  repository: ai4c-tcr.tencentcloudcr.com/agentfoundry/hirebot
  tag: dev-202605081346
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: opensandbox-user

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  ASPNETCORE_URLS: http://+:8080
  DOTNET_NOLOGO: "true"
  # ---- 数据库迁移 ----
  Database__AutoMigrateOnStartup: "true"
  # ---- 安全 / OIDC ----
  Security__OidcAuthority: http://test-passport.zyagi.cn:1080/realms/ai4c-saas
  Security__OidcAudience: ""
  Security__OidcClientId: ncrew-client
  Security__OidcRequireHttpsMetadata: "false"
  # ---- 前端 runtime-config 注入 ----
  ConsoleAuth__Authority: http://test-passport.zyagi.cn:1080
  ConsoleAuth__Realm: ai4c-saas
  ConsoleAuth__ClientId: ncrew-client
  ConsoleAuth__BypassAuth: "false"
  # ---- 跨域 ----
  AllowedOrigins__0: http://localhost:5173
  AllowedOrigins__1: http://localhost:3000
  # ---- OpenSandbox 沙箱服务地址 ----
  OpenSandbox__Domain: opensandbox-server.zyagi.cn:1080
  OpenSandbox__Protocol: Http
  OpenSandbox__UseServerProxy: "false"
  OpenSandbox__Image: ai4c-tcr.tencentcloudcr.com/agentfoundry/king-crab:opensandbox-202605081001
  OpenSandbox__Resource__cpu: 500m
  OpenSandbox__Resource__memory: 1Gi
  OpenSandbox__TimeoutSeconds: "43200"
  OpenSandbox__ReadyTimeoutSeconds: "180"
  OpenSandbox__RequestTimeoutSeconds: "180"
  OpenSandbox__GatewayPort: "18789"
  OpenSandbox__Entrypoint__0: /app/OpenClaw.Gateway
  # ---- 沙箱 KingCrab 子配置（对应报错缺失的三个必填项）----
  OpenSandbox__KingCrab__AuthToken: ncrew-hire-sandbox-token
  OpenSandbox__KingCrab__OidcAuthority: http://test-passport.zyagi.cn:1080/realms/ai4c-saas
  OpenSandbox__KingCrab__OidcAudience: account
  OpenSandbox__KingCrab__ToolTimeoutSeconds: "300"
  OpenSandbox__KingCrab__LlmModel: MiniMax-M2.5
  OpenSandbox__KingCrab__LlmEndpoint: https://api.minimaxi.com/v1
  # LlmApiKey 和 ClientSecret 通过 secretEnv 注入
  # KingCrabSandboxTokenProvider 优先用 ClientId/ClientSecret 向 Keycloak 换取 token；
  # 若两者未配置则回退到静态 AuthToken。
  OpenSandbox__KingCrab__ClientId: ncrew-hire
  # ---- 沙箱 PVC ----
  SandboxPvc__Enabled: "false"
  SandboxPvc__Namespace: opensandbox
  SandboxPvc__StorageClassName: nfs-csi
  SandboxPvc__WorkspaceSize: 5Gi
  SandboxPvc__MemorySize: 5Gi
  SandboxPvc__AccessMode: ReadWriteMany
  SandboxPvc__KubeConfigPath: ""
  # ---- KingCrab HTTP 客户端（调用 KingCrab API 服务）----
  # 代码以 KingCrab:* 为准，KingCrew:* 是旧版兼容 fallback，无需重复设置
  KingCrab__BaseUrl: http://opensandbox-server.zyagi.cn:1080/
  KingCrab__BearerToken: ""
  KingCrab__HttpTimeoutSeconds: "120"
  KingCrab__HireBotApiPrefix: /api/integration/hirebot
  # ---- 构建服务 (ncrew-builder) ----
  BuildService__BaseUrl: http://ncrew-builder.zyagi.cn:1080/
  BuildService__ApiPrefix: /api/store
  BuildService__BearerToken: ""
  BuildService__HttpTimeoutSeconds: "60"

extraEnv: []

# 敏感值通过 secretEnv 注入（不写入 values，由外部 Secret 提供）
# 必须配置：LlmApiKey（AI 推理）+ ClientSecret（沙箱 OIDC token 换取）
secretEnv: []
# 示例（使用 secrets.create=true 时 secretName 填 ncrew-hire-env）：
# secretEnv:
#   - name: OpenSandbox__KingCrab__LlmApiKey
#     secretName: ncrew-hire-env
#     secretKey: OpenSandboxKingCrabLlmApiKey
#   - name: OpenSandbox__KingCrab__ClientSecret
#     secretName: ncrew-hire-env
#     secretKey: OpenSandboxKingCrabClientSecret

database:
  existingSecret: ""
  secretName: ncrew-hire-db
  secretKey: ConnectionStrings__DefaultConnection
  connectionString: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=HireBot"

secrets:
  create: false
  stringData: {}
