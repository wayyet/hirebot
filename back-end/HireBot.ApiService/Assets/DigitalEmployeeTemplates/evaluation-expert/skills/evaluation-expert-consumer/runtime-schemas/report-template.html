<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评估报告 — {{EMPLOYEE_NAME}}</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --primary: #1a73e8;
  --danger: #d93025;
  --success: #1e8e3e;
  --bg: #eef1f6;
  --card: #ffffff;
  --border: #d8dde8;
  --text: #1d2433;
  --text-secondary: #5f6878;
  --shadow-sm: 0 1px 4px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  /* 细腻的点阵背景增加页面纵深感 */
  background-image: radial-gradient(circle, #c8cedb 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text);
  line-height: 1.6;
}
.container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
.header { text-align: center; margin-bottom: 36px; }
.header h1 { font-size: 26px; font-weight: 600; letter-spacing: -.3px; margin-bottom: 8px; color: var(--text); }
.header .subtitle { color: var(--text-secondary); font-size: 14px; }
.badge { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; letter-spacing: .2px; }
.badge-pass { background: #d2f4e0; color: #0d6e34; border: 1px solid #a3e6c3; }
.badge-fail { background: #fde8e6; color: #b91c1c; border: 1px solid #fbb4ae; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s;
}
.card:hover { box-shadow: var(--shadow-md); }
.card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); color: var(--text); letter-spacing: -.1px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
.score-big { font-size: 72px; font-weight: 800; text-align: center; letter-spacing: -3px; }
.score-big.pass { color: #1a7340; }
.score-big.fail { color: #c5221f; }
.radar-container { position: relative; max-width: 450px; margin: 0 auto; }
.dimension-table { width: 100%; border-collapse: collapse; }
.dimension-table th, .dimension-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
.dimension-table th { font-weight: 500; color: var(--text-secondary); font-size: 13px; }
.score-bar { height: 8px; border-radius: 4px; background: #e8eaed; position: relative; }
.score-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.red-line-box { background: #fce8e6; border: 1px solid #f28b82; border-radius: 8px; padding: 16px; }
.red-line-box.ok { background: #e6f4ea; border-color: #81c995; }
.tab-bar { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; overflow-x: auto; gap: 2px; }
.tab-btn { padding: 9px 18px; border: none; background: none; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; border-radius: 8px 8px 0 0; transition: background .15s, color .15s; }
.tab-btn:hover { background: #f0f4ff; color: var(--primary); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #f0f4ff; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.chat-history { max-height: 500px; overflow-y: auto; padding: 12px; }
.chat-msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; max-width: 80%; }
.chat-msg.customer { background: #e3f2fd; margin-right: auto; border-bottom-left-radius: 4px; }
.chat-msg.employee { background: #f3e5f5; margin-left: auto; border-bottom-right-radius: 4px; }
.chat-msg .actor { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.chat-msg .content { font-size: 14px; white-space: pre-wrap; }
.tool-call { background: #fff3e0; border: 1px solid #ffcc02; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
.tool-call .tool-name { font-weight: 600; color: #e65100; }
.tool-call .tool-params { font-family: monospace; font-size: 13px; margin-top: 4px; color: var(--text-secondary); }
.thinking-block { background: #f1f3f4; border-left: 3px solid var(--primary); padding: 12px; margin-bottom: 8px; font-size: 13px; color: var(--text-secondary); }
.metric-result { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f1f3f4; }
.metric-result:last-child { border-bottom: none; }
.metric-code { font-weight: 500; min-width: 200px; }
.metric-score { font-weight: 700; min-width: 40px; text-align: right; }
.list-styled { padding-left: 20px; }
.list-styled li { margin-bottom: 6px; font-size: 14px; }
.pattern-card { background: #f8f9fa; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.pattern-card .pattern-title { font-weight: 600; margin-bottom: 4px; }
.pattern-card .pattern-obs { font-size: 13px; color: var(--text-secondary); }
.improvement-item { padding: 12px; border-left: 3px solid var(--primary); margin-bottom: 8px; background: #f8f9fa; }
.improvement-item .priority { display: inline-block; background: var(--danger); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 8px; }
.footer { text-align: center; padding: 24px; color: var(--text-secondary); font-size: 12px; }
/* 场景布局 */
.scenario-meta { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
.scenario-meta-item { font-size: 13px; color: var(--text-secondary); }
.scenario-meta-item strong { color: var(--text); }
.scenario-split { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }
@media (max-width: 960px) { .scenario-split { grid-template-columns: 1fr; } }
/* 指标卡片 */
.metric-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 8px; background: #fff; box-shadow: var(--shadow-sm); }
.metric-card-header { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--card); cursor: pointer; user-select: none; transition: background 0.15s; }
.metric-card-header:hover { background: #f4f7ff; }
.metric-score-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.metric-label-zh { font-size: 14px; font-weight: 500; flex: 1; color: var(--text); }
.metric-num { font-size: 17px; font-weight: 700; min-width: 36px; text-align: right; }
.metric-expand-icon { font-size: 14px; color: #c0c7d4; transition: transform 0.2s; margin-left: 2px; font-weight: 300; }
.metric-expand-icon.open { transform: rotate(90deg); }
.metric-card-body { display: none; padding: 0 14px 12px; border-top: 1px solid #eef0f5; background: #f8faff; }
.metric-card-body.open { display: block; }
.metric-score-bar-wrap { margin: 10px 0 8px; }
.metric-score-bar-bg { height: 5px; background: #e4e8f0; border-radius: 3px; overflow: hidden; }
.metric-score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.metric-reasoning { font-size: 13px; line-height: 1.75; color: #3c4043; margin: 8px 0; }
.adj-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.adj-chip { display: inline-flex; align-items: flex-start; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 11px; line-height: 1.5; }
.adj-chip-pos { background: #dff2e8; color: #1a7340; border: 1px solid #b3e0c7; }
.adj-chip-neg { background: #fde8e6; color: #c5221f; border: 1px solid #fbb4ae; }
.adj-chip-delta { font-weight: 700; white-space: nowrap; }
/* 会话气泡 */
.chat-wrap { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; max-height: 600px; overflow-y: auto; box-shadow: var(--shadow-sm); }
.chat-bubble { margin-bottom: 14px; }
.chat-bubble-inner { display: inline-block; max-width: 84%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.chat-bubble.customer .chat-bubble-inner { background: #fff; border: 1px solid #dde3f0; border-bottom-left-radius: 4px; }
.chat-bubble.employee { text-align: left; }
.chat-bubble.employee .chat-bubble-inner { background: #e8f0fe; border-bottom-left-radius: 4px; }
.chat-actor { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }
.chat-bubble.employee .chat-actor { text-align: left; }
/* 场景分析 */
.analysis-block { background: linear-gradient(to right, #f0f4ff, #f8f9ff); border-radius: 10px; padding: 16px 18px; margin-bottom: 20px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; color: var(--text); border-left: 3px solid var(--primary); box-shadow: var(--shadow-sm); }
</style>
</head>
<body>
<div class="container">
  <!-- HEADER -->
  <div class="header" style="background:linear-gradient(135deg,#1a73e8 0%,#0d47a1 100%);border-radius:16px;padding:36px 24px 32px;margin-bottom:28px;color:#fff;box-shadow:0 4px 20px rgba(26,115,232,.3)">
    <h1 style="color:#fff;font-size:24px;font-weight:700;letter-spacing:-.3px;margin-bottom:10px">数字员工能力评估报告</h1>
    <div class="subtitle" style="color:rgba(255,255,255,.8);font-size:14px">
      <strong id="emp-name" style="color:#fff"></strong> <span style="opacity:.6;margin:0 6px">·</span> <span id="emp-role"></span> <span style="opacity:.6;margin:0 6px">·</span> 评估时间：<span id="eval-time"></span>
    </div>
    <div style="margin-top:14px">
      <span class="badge" id="pass-badge" style="font-size:13px;padding:5px 16px"></span>
    </div>
  </div>

  <!-- TAINTED RUN BANNER (STEP 9 / K11 / K16 / K18) -->
  <div id="tainted-banner" style="display:none;background:#fce8e6;border:1px solid #f28b82;border-radius:12px;padding:16px;margin-bottom:24px;color:#a50e0e">
    <strong>⚠️ 评估结论为「指示性（indicative）」而非「结论性（definitive）」</strong>
    <ul id="tainted-reasons" class="list-styled" style="margin-top:8px"></ul>
  </div>

  <!-- OVERVIEW: SCORE + RADAR -->
  <div class="grid-2">
    <div class="card">
      <h2>综合得分</h2>
      <div class="score-big" id="overall-score"></div>
      <div style="text-align:center;margin-top:8px;color:var(--text-secondary)" id="score-desc"></div>
      <!-- Red line -->
      <div style="margin-top:16px" id="redline-box"></div>
    </div>
    <div class="card">
      <h2>能力雷达图</h2>
      <div class="radar-container">
        <canvas id="radarChart"></canvas>
      </div>
    </div>
  </div>

  <!-- DIMENSION SCORES TABLE -->
  <div class="card">
    <h2>维度得分详情</h2>
    <table class="dimension-table">
      <thead><tr><th>维度</th><th>权重</th><th>得分</th><th></th></tr></thead>
      <tbody id="dim-table-body"></tbody>
    </table>
  </div>

  <!-- EXECUTIVE SUMMARY -->
  <div class="card">
    <h2>执行摘要</h2>
    <p id="exec-summary" style="font-size:15px"></p>
  </div>

  <!-- STRENGTHS & WEAKNESSES -->
  <div class="grid-2">
    <div class="card">
      <h2>✅ 优势</h2>
      <ul class="list-styled" id="strengths-list"></ul>
    </div>
    <div class="card">
      <h2>⚠️ 不足</h2>
      <ul class="list-styled" id="weaknesses-list"></ul>
    </div>
  </div>

  <!-- CROSS-SCENARIO PATTERNS -->
  <div class="card">
    <h2>跨场景模式</h2>
    <div id="patterns-container"></div>
  </div>

  <!-- IMPROVEMENT PLAN -->
  <div class="card">
    <h2>改进计划</h2>
    <div id="improvement-container"></div>
  </div>

  <!-- SCENARIO REPORTS (TABS) -->
  <div class="card">
    <h2>场景详情</h2>
    <div class="tab-bar" id="scenario-tabs"></div>
    <div id="scenario-panels"></div>
  </div>

  <!-- OPEN QUESTIONS -->
  <div class="card" id="open-questions-card" style="display:none">
    <h2>待确认事项</h2>
    <ul class="list-styled" id="open-questions-list"></ul>
  </div>

  <div class="footer">
    评估系统 v1.0 · 报告生成时间 <span id="footer-time"></span> · 评估ID: <span id="footer-eval-id"></span>
  </div>
</div>

<!--
  ==================== DATA INJECTION ====================
  STEP 9 agent: replace the content between REPORT_DATA markers
  with the actual evaluation_report.json content.
  Replace SCENARIOS_DATA with an array of objects:
  [{ report: <scenario_report.json>, trace: <trace.json>, enriched: <enriched_case.json> }, ...]
-->
<script id="report-data" type="application/json">
{{REPORT_DATA}}
</script>
<script id="scenarios-data" type="application/json">
{{SCENARIOS_DATA}}
</script>

<script>
// ===== RENDER LOGIC =====
let report, scenarios;
try {
  report = JSON.parse(document.getElementById('report-data').textContent);
  scenarios = JSON.parse(document.getElementById('scenarios-data').textContent);
} catch(e) {
  document.body.innerHTML = '<div style="padding:40px;color:#d93025;font-family:sans-serif"><h2>报告数据解析失败</h2><pre>' + e.message + '</pre></div>';
  throw e;
}
// 确保 report 和 scenarios 不为 null
report = report || {};
scenarios = Array.isArray(scenarios) ? scenarios : [];

// Dimension config
const DIM_CONFIG = {
  functional_completeness: { label: '功能完整性', weight: '25%' },
  interaction_quality: { label: '交互质量', weight: '20%' },
  process_compliance: { label: '流程合规', weight: '20%' },
  problem_resolution: { label: '问题解决', weight: '20%' },
  tool_call_correctness: { label: '工具调用', weight: '15%' }
};
const DIM_ORDER = Object.keys(DIM_CONFIG);
const TARGET_SCORE = 85;

// === STEP 9 / K18 中文叙事字典 ===
// 模板不内置任何 metric / tool 中文名（指标会持续新增，写死会让新指标退化为英文 code）。
// STEP 9 必须在 REPORT_DATA 中注入：
//   report.metric_labels = { <metric_code>: <metrics/<code>.metric.json#display_name>, ... }   // 全量当前评估涉及的 metric
//   report.tool_labels   = { <tool_name>:   <role-catalog tool#display_name>,           ... }   // 全量当前评估涉及的 tool
//   report.dimension_labels = { <dim_code>: <evaluation_context.dimension_meta[dim].display_name>, ... }   // 可选
// 找不到注入项时退化为 code 字符串，并由 K18 self-check 在产出阶段拦截。
const TRIGGER_KIND_LABEL = {
  missing_required_signal: '必须信号缺失',
  forbidden_behavior: '禁止行为出现',
  threshold_breach: '阈值越界'
};
// === 内置指标中文名兜底字典（当 metric_labels 未注入时使用）===
const METRIC_LABEL_FALLBACK = {
  factual_accuracy: '事实准确性',
  proactive_clarification: '主动澄清',
  problem_resolution_completeness: '问题解决完整性',
  professional_tone_consistency: '专业语气一致性',
  response_clarity_and_structure: '回复结构清晰度',
  response_conciseness: '回复简洁度',
  safety_and_ethics_boundary: '安全与伦理边界',
  tool_call_correctness: '工具调用准确性',
  interaction_empathy: '共情与交互质量',
  order_refund_policy_accuracy: '退款政策准确性',
  attendance_rule_compliance: '考勤规则合规',
  confidentiality_boundary_compliance: '保密边界合规',
  bid_clause_completeness: '标书条款完整性',
  legal_citation_accuracy: '法律引用准确性',
  code_change_risk_disclosure: '代码变更风险披露',
};

function metricLabel(code) {
  const inj = (window.__reportLabels && window.__reportLabels.metric) || {};
  return inj[code] || METRIC_LABEL_FALLBACK[code] || code;
}
function toolLabel(code) {
  const inj = (window.__reportLabels && window.__reportLabels.tool) || {};
  return inj[code] || code;
}
function triggerKindLabel(kind) { return TRIGGER_KIND_LABEL[kind] || kind || ''; }
function dimLabel(code) {
  const inj = (window.__reportLabels && window.__reportLabels.dimension) || {};
  return inj[code] || (DIM_CONFIG[code] && DIM_CONFIG[code].label) || code;
}
function translateSignal(sig) {
  if (typeof sig !== 'string') return '';
  let m = sig.match(/^missing_required_tool_call:(.+)$/);
  if (m) return `必须工具未调用：${toolLabel(m[1].trim())}`;
  m = sig.match(/^forbidden_behavior:(.+)$/);
  if (m) return `出现禁止行为：${m[1].trim()}`;
  m = sig.match(/^threshold_breach:(.+)$/);
  if (m) return `阈值越界：${m[1].trim()}`;
  return sig;
}

// Header
document.getElementById('emp-name').textContent = report.employee?.display_name || report.employee?.name || report.employee?.employee_id || '';
document.getElementById('emp-role').textContent = (typeof report.employee?.role === 'object' ? report.employee?.role?.role_id : report.employee?.role) || '';
document.getElementById('eval-time').textContent = report.generated_at ? new Date(report.generated_at).toLocaleString('zh-CN') : '';
const passBadge = document.getElementById('pass-badge');
passBadge.textContent = report.passed ? '✓ 通过' : '✗ 未通过';
passBadge.className = 'badge ' + (report.passed ? 'badge-pass' : 'badge-fail');

// Overall score
const scoreEl = document.getElementById('overall-score');
scoreEl.textContent = report.overall_score;
scoreEl.className = 'score-big ' + (report.passed ? 'pass' : 'fail');
document.getElementById('score-desc').textContent = report.passed ? '达标' : '未达标 — 需改进后复测';

// Inject label dictionaries from REPORT_DATA (STEP 9 MUST author these from
// metrics/<code>.metric.json#display_name and role-catalog tool#display_name —
// the template intentionally has no built-in metric/tool fallback so that newly
// added metrics/tools cannot silently regress into raw English codes).
window.__reportLabels = {
  metric: report.metric_labels || {},
  tool: report.tool_labels || {},
  dimension: report.dimension_labels || {}
};

// Red line
const rl = report.red_line;
const rlBox = document.getElementById('redline-box');
if (rl && rl.triggered !== undefined) {
  const triggered = rl.triggered || (rl.passed === false);
  // K18 中文叙事：优先使用 narratives（已中文化的句子数组）；其次把 details 兼容渲染
  const rawLines = rl.narratives || rl.details || [];
  const items = (Array.isArray(rawLines) ? rawLines : []).map(item => {
    if (typeof item === 'string') return item;
    if (item && item.description) return item.description;
    if (item && item.metric_code && item.trigger_kind) {
      return `${metricLabel(item.metric_code)}：触发"${triggerKindLabel(item.trigger_kind)}"红线`;
    }
    return JSON.stringify(item);
  });
  rlBox.innerHTML = `<div class="red-line-box ${triggered ? '' : 'ok'}">
    <strong>${triggered ? '🔴 红线已触发' : '🟢 红线未触发'}</strong>
    ${items.length ? '<ul style="margin-top:8px;padding-left:20px">' + items.map(d => `<li style="font-size:13px;line-height:1.7">${escapeHtml(d)}</li>`).join('') + '</ul>' : ''}
  </div>`;
} else { rlBox.style.display = 'none'; }

// Radar chart — dimension_scores 兼容两种格式：
// 1. {dim: number}  （schema 标准格式）
// 2. {dim: {score: number, weight: number, passed: bool}}  （Agent 实际输出格式）
function dimScore(k) {
  const v = (report.dimension_scores || {})[k];
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return v;
  if (typeof v === 'object') return v.score || v.value || 0;
  return 0;
}
const dimScores = report.dimension_scores || {};
const radarData = DIM_ORDER.map(k => dimScore(k));
const radarLabels = DIM_ORDER.map(k => `${dimLabel(k)}(${DIM_CONFIG[k].weight})`);
new Chart(document.getElementById('radarChart'), {
  type: 'radar',
  data: {
    labels: radarLabels,
    datasets: [
      { label: '实际得分', data: radarData, backgroundColor: 'rgba(26,115,232,0.2)', borderColor: '#1a73e8', borderWidth: 2, pointRadius: 4, pointBackgroundColor: '#1a73e8' },
      { label: `目标值(${TARGET_SCORE})`, data: DIM_ORDER.map(() => TARGET_SCORE), backgroundColor: 'transparent', borderColor: '#9e9e9e', borderWidth: 1, borderDash: [5,5], pointRadius: 0 }
    ]
  },
  options: {
    responsive: true,
    scales: { r: { min: 0, max: 100, ticks: { stepSize: 20, backdropColor: 'transparent', font: { size: 10 } }, grid: { color: '#dadce0' }, pointLabels: { font: { size: 12 } } } },
    plugins: { legend: { position: 'bottom', labels: { font: { size: 12 } } } }
  }
});

// Dimension table — 兼容 {dim: number} 和 {dim: {score, weight, passed}}
const dimBody = document.getElementById('dim-table-body');
DIM_ORDER.forEach(k => {
  const s = dimScore(k);
  const color = s >= 80 ? 'var(--success)' : s >= 60 ? '#f9a825' : 'var(--danger)';
  dimBody.innerHTML += `<tr>
    <td>${dimLabel(k)}</td><td style="color:var(--text-secondary)">${DIM_CONFIG[k].weight}</td>
    <td style="font-weight:700;color:${color}">${s}</td>
    <td style="width:40%"><div class="score-bar"><div class="score-bar-fill" style="width:${s}%;background:${color}"></div></div></td>
  </tr>`;
});

// Executive summary — 兼容多种键名
document.getElementById('exec-summary').textContent =
  report.executive_summary
  || report.narrative?.executive_summary
  || report.narrative?.summary
  || report.summary
  || '';

// Strengths / Weaknesses
const strList = document.getElementById('strengths-list');
(report.strengths || report.narrative?.strengths || []).forEach(s => strList.innerHTML += `<li>${s}</li>`);
const weakList = document.getElementById('weaknesses-list');
(report.weaknesses || report.narrative?.weaknesses || []).forEach(w => weakList.innerHTML += `<li>${w}</li>`);

// Cross-scenario patterns — 兼容数组和字符串，以及不同键名
const patCont = document.getElementById('patterns-container');
const rawPatterns = report.cross_scenario_patterns
  || report.narrative?.cross_scenario_patterns
  || report.narrative?.cross_scenario_synthesis
  || report.cross_scenario_synthesis
  || [];
// 统一为数组
const patternList = Array.isArray(rawPatterns) ? rawPatterns : (rawPatterns ? [rawPatterns] : []);
patternList.forEach(p => {
  if (typeof p === 'string') { patCont.innerHTML += `<div class="pattern-card"><div class="pattern-obs">${p}</div></div>`; }
  else { patCont.innerHTML += `<div class="pattern-card"><div class="pattern-title">${p.pattern || ''}</div><div class="pattern-obs">${p.observation || ''}</div></div>`; }
});

// Improvement plan — 兼容多种结构
const impCont = document.getElementById('improvement-container');
const rawPlan = report.narrative?.improvement_plan || report.improvement_plan || report.narrative?.improvement_suggestions || [];
(Array.isArray(rawPlan) ? rawPlan : []).forEach(a => {
  if (typeof a === 'string') { impCont.innerHTML += `<div class="improvement-item">${a}</div>`; }
  else {
    const label = a.area ? `<strong>${a.area}</strong>：` : '';
    impCont.innerHTML += `<div class="improvement-item">${label}${a.action || a.suggestion || ''}</div>`;
  }
});

// Scenario tabs
const tabBar = document.getElementById('scenario-tabs');
const panels = document.getElementById('scenario-panels');
scenarios.forEach((sc, i) => {
  const rep = sc.report || {};
  const trace = sc.trace || {};
  const enriched = sc.enriched || {};
  const tcId = rep.test_case_id || trace.test_case_id || `scenario-${i}`;
  const label = rep.scenario_name || rep.test_case_display_name || tcId;

  // Tab button
  tabBar.innerHTML += `<button class="tab-btn ${i===0?'active':''}" onclick="switchTab('${tcId}')">${label}</button>`;

  // Panel
  let panelHtml = `<div class="tab-content ${i===0?'active':''}" id="panel-${tcId}">`;
  // ── 场景元信息 ───────────────────────────────────────────────────────────
  const termReason = trace.termination?.reason || rep.termination?.reason || '';
  const turnsUsed = trace.termination?.turns_used ?? rep.termination?.turns_used ?? '';
  const termLabelMap = {'goal_achieved':'✅ 目标达成','bottom_line_violated':'⛔ 触犯底线','deadlock_detected':'🔄 对话僵局','customer_gave_up':'🚪 客户放弃','max_turns_reached':'⏱ 达到轮次上限','completed_normally':'✅ 正常完成'};
  const termLabel = termLabelMap[termReason] || termReason;
  panelHtml += `<div class="scenario-meta">`;
  if (turnsUsed !== '') panelHtml += `<span class="scenario-meta-item">对话轮次 <strong>${turnsUsed}</strong></span><span style="color:#dde">|</span>`;
  if (termLabel) panelHtml += `<span class="scenario-meta-item">${termLabel}</span>`;
  panelHtml += `</div>`;

  // ── 场景分析（顶部，跨栏）──────────────────────────────────────────────
  const rawNarrative = rep.what_went_well || rep.what_went_wrong || rep.narrative;
  if (rawNarrative && typeof rawNarrative === 'string' && rawNarrative.trim()) {
    panelHtml += `<div class="analysis-block">${escapeHtml(rawNarrative)}</div>`;
  } else if (rawNarrative && typeof rawNarrative === 'object') {
    const well = rep.what_went_well || rep.narrative?.what_went_well || [];
    const wrong = rep.what_went_wrong || rep.narrative?.what_went_wrong || [];
    if (well.length || wrong.length) {
      panelHtml += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">`;
      if (well.length) panelHtml += `<div style="background:#e6f4ea;border-radius:10px;padding:14px"><p style="font-size:11px;font-weight:700;color:#1a7340;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">✅ 做得好</p><ul style="padding-left:16px;font-size:13px;line-height:1.8">${well.map(w=>`<li>${escapeHtml(w)}</li>`).join('')}</ul></div>`;
      if (wrong.length) panelHtml += `<div style="background:#fff3e0;border-radius:10px;padding:14px"><p style="font-size:11px;font-weight:700;color:#b06000;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">⚠️ 需改进</p><ul style="padding-left:16px;font-size:13px;line-height:1.8">${wrong.map(w=>`<li>${escapeHtml(w)}</li>`).join('')}</ul></div>`;
      panelHtml += `</div>`;
    }
  }

  // ── 左右分栏 ───────────────────────────────────────────────────────────
  panelHtml += `<div class="scenario-split">`;

  // 左栏：会话记录
  panelHtml += `<div>`;
  panelHtml += `<p style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px">会话记录</p>`;
  panelHtml += `<div class="chat-wrap">`;
  const dialogTurns = trace.dialog_turns || [];
  if (!dialogTurns.length) panelHtml += `<p style="color:var(--text-secondary);font-size:13px;text-align:center;padding:20px 0">暂无会话记录</p>`;
  dialogTurns.forEach(t => {
    const isCustomer = t.actor === 'evaluator' || t.actor === 'customer';
    panelHtml += `<div class="chat-bubble ${isCustomer?'customer':'employee'}"><div class="chat-actor">${isCustomer?'👤 客户':'🤖 数字员工'}</div><div class="chat-bubble-inner">${escapeHtml(t.content||'')}</div></div>`;
  });
  panelHtml += `</div></div>`; // chat-wrap + 左栏

  // 右栏：指标评分
  panelHtml += `<div>`;
  panelHtml += `<p style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px">指标评分</p>`;

  let metricItems = rep.metric_results || [];
  if (!metricItems.length && rep.metric_scores && typeof rep.metric_scores === 'object') {
    metricItems = Object.entries(rep.metric_scores).map(([code, val]) => ({
      metric_code: code, score: typeof val === 'number' ? val : (val&&val.score)||0, signals: [], observed_signals: []
    }));
  }
  const scoreDetails = sc.metric_score_details || {};
  // 按得分升序排列（弱项优先，便于关注）
  [...metricItems].sort((a,b) => a.score - b.score).forEach((mr, mi) => {
    const score = mr.score;
    const dotColor = score >= 80 ? '#1e8e3e' : score >= 60 ? '#f9a825' : '#d93025';
    const numColor = score >= 80 ? '#1a7340' : score >= 60 ? '#b06000' : '#c5221f';
    const zh = metricLabel(mr.metric_code);
    const signals = (mr.signals||mr.observed_signals||[]).map(translateSignal).filter(Boolean);
    const detail = scoreDetails[mr.metric_code] || {};
    const did = `md-${tcId}-${mi}`, iid = `mi-${tcId}-${mi}`;
    const reasoning = mr.reasoning || detail.reasoning || detail.notes || '';
    const posAdj = detail.positive_adjustments || [];
    const negAdj = detail.negative_adjustments || [];
    const hasDetail = !!(reasoning || posAdj.length || negAdj.length || signals.length);

    panelHtml += `<div class="metric-card">`;
    panelHtml += `<div class="metric-card-header"${hasDetail?` onclick="toggleMetric('${did}','${iid}')"`:' style="cursor:default"'}>`;
    panelHtml += `<span class="metric-score-dot" style="background:${dotColor}"></span>`;
    panelHtml += `<span class="metric-label-zh">${zh}</span>`;
    panelHtml += `<span class="metric-num" style="color:${numColor}">${score}</span>`;
    if (hasDetail) panelHtml += `<span class="metric-expand-icon" id="${iid}">›</span>`;
    panelHtml += `</div>`;
    if (hasDetail) {
      panelHtml += `<div class="metric-card-body" id="${did}">`;
      panelHtml += `<div class="metric-score-bar-wrap"><div class="metric-score-bar-bg"><div class="metric-score-bar-fill" style="width:${score}%;background:${dotColor}"></div></div></div>`;
      if (signals.length) panelHtml += `<p style="font-size:12px;color:#b06000;margin:8px 0 4px">⚠️ ${signals.map(escapeHtml).join('；')}</p>`;
      if (reasoning) panelHtml += `<p class="metric-reasoning">${escapeHtml(reasoning)}</p>`;
      if (posAdj.length || negAdj.length) {
        panelHtml += `<div class="adj-row">`;
        posAdj.forEach(a => { const amt=a.amount??a.delta; panelHtml += `<span class="adj-chip adj-chip-pos"><span class="adj-chip-delta">+${amt}</span><span>${escapeHtml((a.evidence||a.rule_id||'').substring(0,38))}</span></span>`; });
        negAdj.forEach(a => { const amt=a.amount!=null?a.amount:Math.abs(a.delta); panelHtml += `<span class="adj-chip adj-chip-neg"><span class="adj-chip-delta">−${amt}</span><span>${escapeHtml((a.evidence||a.rule_id||'').substring(0,38))}</span></span>`; });
        panelHtml += `</div>`;
      }
      panelHtml += `</div>`;
    }
    panelHtml += `</div>`;
  });

  panelHtml += `</div>`; // 右栏
  panelHtml += `</div>`; // scenario-split
  panels.innerHTML += panelHtml;
});

// Open questions
const oqList = document.getElementById('open-questions-list');
const oqs = report.open_questions || [];
if (oqs.length > 0) {
  document.getElementById('open-questions-card').style.display = '';
  oqs.forEach(q => {
    if (typeof q === 'string') oqList.innerHTML += `<li>${q}</li>`;
    else oqList.innerHTML += `<li><strong>${q.question || ''}</strong>: ${q.context || ''}</li>`;
  });
}

// Footer
document.getElementById('footer-time').textContent = report.generated_at ? new Date(report.generated_at).toLocaleString('zh-CN') : '';
document.getElementById('footer-eval-id').textContent = report.evaluation_id || '';

// Tab switch
function switchTab(tcId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-' + tcId).classList.add('active');
}

// 折叠/展开指标详情
function toggleMetric(did, iid) {
  const body = document.getElementById(did);
  const icon = document.getElementById(iid);
  if (!body) return;
  const open = body.classList.toggle('open');
  if (icon) icon.classList.toggle('open', open);
}
// 向后兼容旧 toggleDetail 调用
function toggleDetail(did, iid) { toggleMetric(did, iid); }

// Tainted-run banner (STEP 9 / K11 / K16 / K18 — Chinese narrative only)
(function(){
  const reasons = [];
  if (report.red_line && report.red_line.triggered) {
    reasons.push('红线已触发：评估未通过');
    const narratives = report.red_line.narratives || report.red_line.details || [];
    narratives.forEach(d => {
      if (typeof d === 'string') reasons.push(d);
      else if (d && d.description) reasons.push(d.description);
    });
  }
  (report.open_questions || []).forEach(q => {
    const text = typeof q === 'string' ? q : (q.question || '');
    if (text) reasons.push('待确认事项：' + text);
  });
  if (reasons.length > 0) {
    const el = document.getElementById('tainted-banner');
    if (el) {
      el.style.display = '';
      const ul = document.getElementById('tainted-reasons');
      reasons.forEach(r => { const li = document.createElement('li'); li.textContent = r; ul.appendChild(li); });
    }
  }
})();

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}
</script>
